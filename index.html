
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi PPA Kumanawarugu Ana</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f3f5f7;
    }
    #reader {
      max-width: 420px;
      margin: 20px auto;
    }
    h2 { color: #17365d; }
    #status { font-weight: bold; }
  </style>
</head>
<body>
  <h2>ABSENSI PPA KUMANAWARUGU ANA</h2>
  <p>Arahkan kamera ke QR Code resmi yang dipasang di aula.</p>
  <div id="reader"></div>
  <p id="status">Menyiapkan kamera...</p>

  <script>
    const URL_ABSENSI =
      "https://script.google.com/macros/s/AKfycbxBJwUF58qI2D1y5UxJQKklLr_JuEs0PKn0pE5ZgRa2TYJRWmqiwlfgXnCSsdxwvGOQrQ/exec";

    const QR_RESMI = "PPA_KUMANAWARUGU_ANA_AULA_2026";
    let sudahDipindai = false;

    function berhasilDipindai(teks) {
      if (sudahDipindai) return;

      const hasil = teks.trim();

      if (hasil !== QR_RESMI) {
        document.getElementById("status").textContent =
          "QR Code tidak dikenal. Pindai QR resmi aula.";
        return;
      }

      sudahDipindai = true;
      document.getElementById("status").textContent =
        "QR berhasil! Membuka halaman absensi...";

      window.location.href =
        URL_ABSENSI + "?qr=" + encodeURIComponent(hasil);
    }

    const scanner = new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(kamera => {
      if (!kamera || kamera.length === 0) {
        throw new Error("Kamera tidak ditemukan.");
      }

      const belakang = kamera.find(k =>
        /back|rear|environment/i.test(k.label)
      );

      const kameraId = belakang ? belakang.id : kamera[0].id;

      scanner.start(
        kameraId,
        { fps: 10, qrbox: { width: 250, height: 250 } },
        berhasilDipindai
      ).then(() => {
        document.getElementById("status").textContent =
          "Kamera aktif. Silakan pindai QR aula.";
      });
    }).catch(error => {
      document.getElementById("status").textContent =
        "Kamera gagal dibuka: " + error;
    });
  </script>
</body>
</html>
