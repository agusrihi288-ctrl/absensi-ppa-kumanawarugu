
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemindai QR PPA Kumanawarugu Ana</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial;background:#eef4f0;color:#173b32;text-align:center;padding:20px}
.box{max-width:480px;margin:auto;background:white;padding:20px;border-radius:16px}
button{background:#176b52;color:white;border:0;padding:14px;border-radius:10px;font-size:16px;width:100%;margin-top:15px}
#reader{margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h2>PPA KUMANAWARUGU ANA</h2>
<h3>Pemindai QR Lokasi Aula</h3>
<p>Tekan tombol di bawah dan arahkan kamera ke QR resmi aula PPA.</p>
<div id="reader"></div>
<button onclick="mulaiScan()">BUKA KAMERA</button>
<p id="status">Menunggu kamera...</p>
</div>

<script>
const URL_ABSENSI = "https://script.google.com/macros/s/AKfycbxSth0jKUu8ewMY2piufkY4SV-Bh7avCM16BSkKe9UOhvp2J3vGG4cUk04YNKSgPzfajA/exec";
const QR_RESMI = "PPA_KUMANAWARUGU_ANA_AULA_2026";
let scanner = null;
let selesai = false;

async function mulaiScan(){
  const status = document.getElementById("status");
  try {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      throw new Error("Buka halaman melalui HTTPS di Google Chrome.");
    }
    if (!window.Html5Qrcode) {
      throw new Error("Pemindai belum termuat. Periksa koneksi internet.");
    }
    if (!scanner) scanner = new Html5Qrcode("reader");
    status.textContent = "Meminta izin kamera...";
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      async function(teks){
        if(selesai) return;
        if(teks.trim() !== QR_RESMI){
          status.textContent = "QR tidak sesuai. Pindai QR resmi aula.";
          return;
        }
        selesai = true;
        status.textContent = "QR benar. Membuka halaman absensi...";
        await scanner.stop();
        window.location.href = URL_ABSENSI + "?qr=" + encodeURIComponent(teks.trim());
      }
    );
    status.textContent = "Kamera aktif. Arahkan ke QR aula.";
  } catch(e) {
    status.textContent = "Kamera gagal: " + (e.message || e);
  }
}
</script>
</body>
</html>
